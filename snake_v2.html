
<!DOCTYPE html>
<html>
<head>
    <title>Snake Game V2 - No Walls</title>
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #222; color: white; font-family: Arial, sans-serif; }
        canvas { border: 2px solid #44ff44; background-color: #000; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
        #score { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        #mode { font-size: 18px; color: #44ff44; margin-bottom: 5px; }
        #instructions { margin-top: 10px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <div id="mode">Mode: Wall Wrapping Enabled ∞</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="instructions">Use Arrow Keys to Move</div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0;
        let dy = 0;
        let score = 0;

        function drawRect(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * gridSize, y * gridSize, gridSize - 2, gridSize - 2);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRect(food.x, food.y, '#ff4444');
            snake.forEach((segment, index) => {
                drawRect(segment.x, segment.y, index === 0 ? '#44ff44' : '#22aa22');
            });
        }

        function update() {
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (dx === 0 && dy === 0) return;

            // Wall wrapping logic
            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            // Self collision check
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    resetGame();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById('score').innerText = 'Score: ' + score;
                placeFood();
            } else {
                snake.pop();
            }
        }

        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            snake.forEach(segment => {
                if (segment.x === food.x && segment.y === food.y) placeFood();
            });
        }

        function resetGame() {
            // Optional: remove alert to make it less annoying, or keep it.
            // Let's keep it simple but maybe log to console too.
            console.log('Game Over');
            alert('Game Over! Score: ' + score);
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            document.getElementById('score').innerText = 'Score: 0';
            placeFood();
        }

        document.addEventListener('keydown', (e) => {
            // Prevent default scrolling for arrow keys
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            switch(e.key) {
                case 'ArrowUp': if (dy !== 1) { dx = 0; dy = -1; } break;
                case 'ArrowDown': if (dy !== -1) { dx = 0; dy = 1; } break;
                case 'ArrowLeft': if (dx !== 1) { dx = -1; dy = 0; } break;
                case 'ArrowRight': if (dx !== -1) { dx = 1; dy = 0; } break;
            }
        });

        setInterval(() => {
            update();
            draw();
        }, 100);
    </script>
</body>
</html>
